<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX予想">
<meta name="theme-color" content="#0a1628">
<link rel="apple-touch-icon" href="icon.png">
<title>FX予想アプリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a1628;min-height:100vh;padding-bottom:40px;}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.app-icon{width:120px;height:120px;border-radius:27px;box-shadow:0 8px 32px rgba(0,0,0,.5);margin-bottom:1.5rem;}
.app-name{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:6px;}
.app-sub{font-size:14px;color:#94a3b8;margin-bottom:2.5rem;text-align:center;line-height:1.6;}
.install-card{background:#1e2d4a;border-radius:20px;padding:1.5rem;width:100%;max-width:360px;margin-bottom:1.5rem;}
.install-title{font-size:13px;font-weight:700;color:#64748b;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1rem;}
.step{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #2a3f5f;}
.step:last-child{border-bottom:none;}
.step-icon{font-size:24px;width:34px;text-align:center;flex-shrink:0;}
.step-text{font-size:14px;color:#cbd5e1;line-height:1.6;padding-top:2px;}
.step-text b{color:#fff;}
.arrow-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:1rem 0;}
.arrow{font-size:40px;animation:bounce 1.5s infinite;}
.arrow-text{font-size:12px;color:#475569;text-align:center;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.open-btn{width:100%;max-width:360px;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.4);margin-top:1rem;}
.note{margin-top:1.5rem;font-size:11px;color:#1e3a5f;text-align:center;max-width:300px;line-height:1.6;}
</style>
</head>
<body>
<div class="splash">
  <img class="app-icon" src="icon.png" alt="FX予想">
  <div class="app-name">FX予想アプリ</div>
  <div class="app-sub">要人発言・ニュース・経済指標を<br>AIがリアルタイム分析</div>
  <div class="install-card">
    <div class="install-title">📱 ホーム画面に追加する方法</div>
    <div class="step"><div class="step-icon">1️⃣</div><div class="step-text">iPhoneの <b>Safari</b> でこのページを開く</div></div>
    <div class="step"><div class="step-icon">2️⃣</div><div class="step-text">画面下の <b>共有ボタン（□↑）</b> をタップ</div></div>
    <div class="step"><div class="step-icon">3️⃣</div><div class="step-text"><b>「ホーム画面に追加」</b> をタップ</div></div>
    <div class="step"><div class="step-icon">4️⃣</div><div class="step-text">右上の <b>「追加」</b> をタップして完了！</div></div>
  </div>
  <div class="arrow-wrap">
    <div class="arrow">👇</div>
    <div class="arrow-text">Safariの共有ボタンをタップ</div>
  </div>
  <button class="open-btn" onclick="window.location.href='https://claude.ai'">🤖 Claude AIで今すぐ予想を見る</button>
  <div class="note">※ このアプリはClaude AIと連携しています<br>※ 投資判断はご自身の責任で行ってください</div>
</div>
</body>
</html>
